[project]
name = "managent"
version = "0.1.0"
description = "ManAgent — event-driven universal agent runtime (stdin/stdout JSON protocol)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.0",
  "Jinja2>=3.1.0",
  "aiohttp>=3.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "openai>=1.0",
  "google-genai>=1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.0", "torch>=2.0", "transformers>=4.40"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
